<!doctype html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your report is ready</title>
  </head>
  <body style="margin:0;padding:24px;font-family:Arial,Helvetica,sans-serif;color:#1f2933;background:#ffffff">
    <p>Hello,</p>
    <p>Your report <strong>{{reportName}}</strong> is ready.</p>
    <p>
      <a href="{{entityUrl}}" style="display:inline-block;padding:10px 16px;background:#1f5fbf;color:#ffffff;text-decoration:none;border-radius:4px">Open the report</a>
    </p>
    <hr style="border:none;border-top:1px solid #d9dee3" />
    <p style="font-size:12px;color:#616e7c">
      You get this e-mail immediately because "Report ready" notifications are set to immediate.
      <a href="{{preferencesUrl}}" style="color:#616e7c">Manage notifications</a>
    </p>
  </body>
</html>
