# Included in every location: a location's own add_header drops the server-level ones.
#
# CSP notes: the Mailbox renders e-mail HTML in <iframe sandbox="" srcdoc>. srcdoc documents
# inherit this policy, so style-src allows inline styles (e-mail markup is inline-styled; the app
# itself ships none) and frame-src allows about: (about:srcdoc). The iframe adds its own stricter
# policy (default-src 'none'; img-src data:) - policies intersect, so remote content stays blocked.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self' about:; child-src 'self' about:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
