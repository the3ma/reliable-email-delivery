# Local stand-in for the AWS stack: LocalStack for EventBridge / SQS / DynamoDB / SSM, Mailpit for SES.
# The workers long-poll the queues and call the same handlers the Lambdas run.
#   make up      localstack + mailpit + both workers
#   make seed    subscriptions (every 10th address pre-suppressed)
#   make smoke   publish -> immediate + digest -> dedup -> suppression -> kill switch -> feedback
#   make demo    + the Delivery Console (http://localhost:8080) - a local demo UI, never deployed
name: reliable-email-delivery

x-env: &env
  AWS_ENDPOINT_URL: http://localstack:4566
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: test # LocalStack's documented dummy credentials
  AWS_SECRET_ACCESS_KEY: test
  MAIL_TRANSPORT: smtp
  SMTP_HOST: mailpit
  SMTP_PORT: '1025'
  SSM_PREFIX: /local/email/
  SENDING_HARD_DISABLED: 'false'
  FROM_ADDRESS: notifications@example.test
  APP_BASE_URL: http://localhost:8080
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  # Local only: pick up kill-switch changes in seconds (AWS keeps the 5-minute default).
  TOGGLE_CACHE_TTL_SECONDS: '5'

x-functions: &functions
  build:
    context: .
    dockerfile: Dockerfile.functions
  image: reliable-email-delivery/functions:local
  init: true # SIGTERM reaches node through npm
  environment:
    <<: *env
  depends_on:
    localstack: { condition: service_healthy }
    mailpit: { condition: service_started }

services:
  localstack:
    image: localstack/localstack:4
    environment:
      SERVICES: sqs,dynamodb,ssm,events
      # Queue URLs must point at this service, not localhost: SDK v3 sends SQS calls to the queue URL host.
      LOCALSTACK_HOST: localstack:4566
      SQS_ENDPOINT_STRATEGY: path
    ports: ['4566:4566']
    volumes:
      - ./deploy/localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
    healthcheck:
      test:
        ['CMD-SHELL', 'awslocal ssm get-parameter --name /local/email/record-deliveries >/dev/null']
      interval: 3s
      timeout: 5s
      retries: 40

  mailpit:
    image: axllent/mailpit:latest
    ports: ['8025:8025', '1025:1025']

  worker-immediate:
    <<: *functions
    command: ['worker-immediate']

  worker-processor:
    <<: *functions
    command: ['worker-processor']

  # One-shot jobs: `docker compose run --rm jobs <script> [-- args]`.
  jobs:
    <<: *functions
    profiles: [jobs]

  # Delivery Console (local demo UI, docs/CONSOLE.md): `docker compose --profile demo up -d`.
  console-api:
    <<: *functions
    profiles: [demo]
    command: ['console-api']
    environment:
      <<: *env
      PORT: '3001'
      MAILPIT_URL: http://mailpit:8025
      WEB_ORIGIN: http://localhost:8080
    ports: ['3001:3001']
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3001/api/v1/health >/dev/null || exit 1']
      interval: 3s
      timeout: 3s
      retries: 30

  web:
    build:
      context: ./web
      target: serve
    profiles: [demo]
    environment:
      API_UPSTREAM: console-api:3001
    ports: ['8080:8080']
    depends_on:
      console-api: { condition: service_healthy }
